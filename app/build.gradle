plugins {
    id 'com.android.application'
    id("com.google.gms.google-services")
    id("com.google.firebase.crashlytics")
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def secretsProperties = new Properties()
def secretsPropertiesFile = rootProject.file("secrets.properties")
if (secretsPropertiesFile.exists()) {
    secretsProperties.load(new FileInputStream(secretsPropertiesFile))
}

def readSecret = { key, defaultValue = "" ->
    def value = secretsProperties.getProperty(key)
    return value != null ? value : localProperties.getProperty(key, defaultValue)
}

def githubToken = readSecret("github.token")
def githubOwner = readSecret("github.owner")
def githubRepo = readSecret("github.repo")
def githubBranch = readSecret("github.branch", "main")
def kinopoiskApiKey = readSecret("kinopoisk.apiKey")
def releaseStoreFile = readSecret("RELEASE_STORE_FILE")
def releaseStorePassword = readSecret("RELEASE_STORE_PASSWORD")
def releaseKeyAlias = readSecret("RELEASE_KEY_ALIAS")
def releaseKeyPassword = readSecret("RELEASE_KEY_PASSWORD")

def escapeForBuildConfig = { value ->
    value.replace("\\", "\\\\").replace('"', '\\"')
}

android {
    namespace 'ru.bl3xand.pancake'
    compileSdk 36

    defaultConfig {
        applicationId "ru.bl3xand.pancake"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "0.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "GITHUB_TOKEN", "\"${escapeForBuildConfig(githubToken)}\""
        buildConfigField "String", "GITHUB_OWNER", "\"${escapeForBuildConfig(githubOwner)}\""
        buildConfigField "String", "GITHUB_REPO", "\"${escapeForBuildConfig(githubRepo)}\""
        buildConfigField "String", "GITHUB_BRANCH", "\"${escapeForBuildConfig(githubBranch)}\""
        buildConfigField "String", "KINOPOISK_API_KEY", "\"${escapeForBuildConfig(kinopoiskApiKey)}\""
    }

    signingConfigs {
        release {
            if (!releaseStoreFile.isBlank()) {
                storeFile file(releaseStoreFile)
            }
            if (!releaseStorePassword.isBlank()) {
                storePassword releaseStorePassword
            }
            if (!releaseKeyAlias.isBlank()) {
                keyAlias releaseKeyAlias
            }
            if (!releaseKeyPassword.isBlank()) {
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            versionNameSuffix "release."
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            shrinkResources true
            signingConfig signingConfigs.release

            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }
        debug {
            versionNameSuffix "debug."
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            shrinkResources false
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }

    packagingOptions {
        resources.excludes.add("META-INF/*")
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def buildTypeSuffix = ""
        if (variant.buildType == "release") {
            buildTypeSuffix = "release."
        } else if (variant.buildType == "debug") {
            buildTypeSuffix = "debug."
        }
        def baseVersionName = android.defaultConfig.versionName
        def newVersionName = "${buildTypeSuffix}${baseVersionName}"

        variant.outputs.each { output ->
            output.versionName.set(newVersionName)
        }
    }
}

// Переименование APK файла через задачу
tasks.configureEach { task ->
    if (task.name.startsWith("assemble")) {
        task.doLast {
            def outputDir = file("${buildDir}/outputs/apk")
            if (outputDir.exists()) {
                outputDir.eachFileRecurse { file ->
                    if (file.name.endsWith(".apk") && !file.name.startsWith("Pancake")) {
                        def buildType = ""
                        if (file.path.contains("/release/")) {
                            buildType = "release."
                        } else if (file.path.contains("/debug/")) {
                            buildType = "debug."
                        }
                        def versionName = android.defaultConfig.versionName
                        def newName = "Pancake ${buildType}${versionName}.apk"
                        def newFile = new File(file.parentFile, newName)
                        file.renameTo(newFile)
                    }
                }
            }
        }
    }
}

